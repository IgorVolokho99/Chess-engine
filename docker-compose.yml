name: MariaNet


services:
  db:
    image: postgres:17-alpine
    container_name: marianet-postgres
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

    environment:
      POSTGRES_DB: marianet
      POSTGRES_USER: marianet_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password

    secrets:
      - db_password

    volumes:
      - psql_data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5432:5432"

    networks:
      - app-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrations:
    build:
      context: .
      dockerfile: Dockerfile

    command: alembic upgrade head

    env_file:
      - .env.compose

    secrets:
      - db_password

    depends_on:
      db:
        condition: service_healthy

    networks:
      - app-network

    restart: "no"

volumes:
  psql_data:

networks:
  app-network:
    driver: bridge 

secrets:
  db_password:
    file: ./secrets/db_password.txt

