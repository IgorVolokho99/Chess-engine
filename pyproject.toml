[project]
name = "chess-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "cryptography>=49.0.0",
    "flask>=3.1.3",
    "psycopg[binary]>=3.3.4",
    "pymysql>=1.1.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.47",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.3",
]


[tool.ruff.lint]
select = ["ALL"]
exclude = [
    "tests/*"
]